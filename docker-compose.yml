version: '3.8'

services:
  # ========== BACKEND SPRING BOOT ==========
  spring-backend:
    image: mariemjls-5arctict7-appgestionprojets-backend:latest
    container_name: spring-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/test_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      - mysql-db
    networks:
      - app-network

  # ========== FRONTEND ANGULAR ==========
  angular-frontend:
    image: mariemjls-5arctict7-appgestionprojets-frontend:latest
    container_name: angular-frontend
    ports:
      - "4200:80"
    depends_on:
      - spring-backend
    networks:
      - app-network

  # ========== BASE DE DONNÉES MYSQL ==========
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test_db
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - app-network

volumes:
  mysql-data:

networks:
  app-network:
    driver: bridge
